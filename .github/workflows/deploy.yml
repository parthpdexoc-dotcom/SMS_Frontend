name: Deploy Frontend to IIS

on:
  push:
    branches:
      - develop
      - Develop
      - uat
      - UAT
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - Dev
          - UAT
          - Prod
        default: 'Dev'
      api_base_url:
        description: 'Override API Base URL (leave blank for environment default)'
        required: false
        default: ''
      iis_site_path:
        description: 'Override Target IIS Site Directory (leave blank for environment default)'
        required: false
        default: ''
      skip_deployment:
        description: 'Build only (do not deploy to IIS)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Execute Deployment
        shell: powershell
        env:
          CI: false
        run: |
          # Determine environment from input or branch
          $envName = "${{ github.event.inputs.environment }}"
          if ([string]::IsNullOrWhiteSpace($envName)) {
            $branch = "${{ github.ref_name }}"
            if ($branch -match "uat") {
              $envName = "UAT"
            } elseif ($branch -in @("main", "master")) {
              $envName = "Prod"
            } else {
              $envName = "Dev"
            }
          }

          $apiUrl = "${{ github.event.inputs.api_base_url }}"
          $sitePath = "${{ github.event.inputs.iis_site_path }}"

          Write-Host "=========================================================="
          Write-Host " Triggering SMS Frontend IIS Deployment via GitHub Actions"
          Write-Host " Environment:     $envName"
          Write-Host " Branch:          ${{ github.ref_name }}"
          if (-not [string]::IsNullOrWhiteSpace($apiUrl)) {
            Write-Host " Custom API URL:  $apiUrl"
          }
          if (-not [string]::IsNullOrWhiteSpace($sitePath)) {
            Write-Host " Custom IIS Path: $sitePath"
          }
          Write-Host "=========================================================="

          $deployArgs = @(
            "-SkipGitPull",
            "-Environment", "$envName",
            "-TargetBranch", "${{ github.ref_name }}"
          )
          if (-not [string]::IsNullOrWhiteSpace($apiUrl)) {
            $deployArgs += @("-ApiBaseUrl", "$apiUrl")
          }
          if (-not [string]::IsNullOrWhiteSpace($sitePath)) {
            $deployArgs += @("-IisSitePath", "$sitePath")
          }

          & ".\deploy\deploy.ps1" @deployArgs
