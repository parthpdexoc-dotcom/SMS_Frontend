name: Deploy Frontend to IIS

on:
  push:
    branches:
      - develop
      - Develop
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      iis_site_path:
        description: 'Target IIS Site Directory on Windows Server'
        required: false
        default: 'C:\inetpub\wwwroot\SMS'
      skip_deployment:
        description: 'Build and validate only (do not deploy to IIS)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Deployment
        shell: powershell
        env:
          CI: false
        run: |
          $sitePath = "${{ github.event.inputs.iis_site_path }}"
          if ([string]::IsNullOrWhiteSpace($sitePath)) { $sitePath = "C:\inetpub\wwwroot\SMS" }

          Write-Host "=========================================================="
          Write-Host " Triggering SMS Frontend IIS Deployment via GitHub Actions"
          Write-Host " Target IIS Path: $sitePath"
          Write-Host " Branch:          ${{ github.ref_name }}"
          Write-Host "=========================================================="

          .\deploy\deploy.ps1 -SkipGitPull -IisSitePath "$sitePath" -TargetBranch "${{ github.ref_name }}"
