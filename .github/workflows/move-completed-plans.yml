# ============================================================================
# Workflow: Move Completed Plan Files
# ============================================================================
# This workflow automatically moves plan files from in-progress to completed
# when a PR is merged. It creates a new PR for the file move operation.
#
# SETUP REQUIRED FOR YOUR REPOSITORY:
# ------------------------------------
# 1. GitHub App Authentication (REQUIRED):
#    - The GitHub App "mh-ghapp-repo-int-aimgmtplans" is already created in the org
#    - Grant this app access to your repository:
#      * Go to the app settings: https://github.com/organizations/YOUR_ORG/settings/installations
#      * Find "mh-ghapp-repo-int-aimgmtplans" and click Configure
#      * Under "Repository access", select your repository
#    - Add the following secrets/variables to your repo:
#      * Variable: AIMGMTPLANS_APP_ID (or rename to your preference)
#      * Secret: AIMGMTPLANS_APP_PRIVATE_KEY (or rename to your preference)
#
# 2. Status Checks Configuration (REQUIRED if branch protection uses status checks):
#    - GitHub App tokens cannot read branch protection via API in workflow context
#    - Create a repository variable with required status check names:
#      * Variable name: PLAN_AUTOMATION_STATUS_CHECKS
#      * Value: Comma-separated list of required check context names
#      * Example: "ci/circleci: build-js,ci/circleci: build-ruby"
#    - Find your required checks in: Settings → Branches → Branch protection rules
#    - The workflow will create passing status checks for these contexts
#
# 3. PR Merge Strategy (CUSTOMIZE, if desired):
#    - Change --squash to --merge or --rebase if preferred
#
# WORKFLOW BEHAVIOR:
# ------------------
# - Triggers when a PR is merged to specified branches
# - Finds plan files in in-progress/ matching the PR's branch name
# - Moves matching files to completed/
# - Creates a new PR with the moved files
# - Auto-merges the PR (requires branch protection rules allowing it)
# ============================================================================

name: Move Completed Plan Files

on:
  pull_request:
    types: [closed]
    branches:
      - master
      - main
      - develop
      - development

permissions:
  contents: write           # Required to commit and push changes
  pull-requests: write      # Required to create and merge PRs
  statuses: write           # Required to create commit statuses (optional)

jobs:
  move-plans:
    # Only run if the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Generate GitHub App token for authentication
      # CUSTOMIZE: Update app-id and private-key references if you named them differently
      - name: Generate a AIMGMTPLANS GHAPP token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AIMGMTPLANS_APP_ID }}           # Variable: Your GitHub App ID
          private-key: ${{ secrets.AIMGMTPLANS_APP_PRIVATE_KEY }}  # Secret: Your GitHub App private key

      # STEP 2: Checkout the repository
      - name: checkout repo content
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}   # Check out the base branch (e.g., main)
          token: ${{ steps.generate-token.outputs.token }} # Use GitHub App token for auth
          fetch-depth: 0                                   # Fetch all history for proper branching

      # STEP 3: Configure Git for commits
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # STEP 4: Move plan files and create PR
      - name: Move plan files and Create PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}  # Required for gh CLI commands
        run: |
          # Capture PR information
          PR_BRANCH_NAME="${{ github.event.pull_request.head.ref }}"   # The branch that was merged
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"     # The base branch (main/master)
          AUTO_PR_BRANCH="automation/move-files-${{ github.event.pull_request.number }}"  # New branch for automation

          # Create a new local branch for the file move changes
          git checkout -b "$AUTO_PR_BRANCH"

          # Find and move matching plan files
          # LOGIC: Looks for plan files in in-progress/ where the frontmatter 'branch:' field
          #        matches the PR branch name that was just merged
          MOVED_FILES=0
          if [ -d "plan-files/in-progress" ]; then
            for file in plan-files/in-progress/*.md; do
              if [ -f "$file" ]; then
                # Extract the branch name from YAML frontmatter
                PLAN_BRANCH=$(awk 'BEGIN{in_fm=0} /^---$/{in_fm++; next} in_fm==1 && /^branch:/{print $2; exit}' "$file")

                # If the plan's branch matches the PR branch, move it to completed
                if [ "$PLAN_BRANCH" = "$PR_BRANCH_NAME" ]; then
                  filename=$(basename "$file")
                  git mv "$file" "plan-files/completed/$filename"
                  MOVED_FILES=$((MOVED_FILES + 1))
                  echo "Moving: $filename"
                fi
              fi
            done
          fi

          # Only create a PR if files were actually moved
          if [ $MOVED_FILES -gt 0 ]; then
            # Commit the changes
            git commit -m "Move plan file(s) to completed [skip ci]"
            git push origin "$AUTO_PR_BRANCH"

            # Update branch with latest from base to avoid "branch behind" errors
            echo "Updating branch with latest changes from $TARGET_BRANCH..."
            git fetch origin "$TARGET_BRANCH"
            git merge "origin/$TARGET_BRANCH" --no-edit
            git push origin "$AUTO_PR_BRANCH"

            # Get the commit SHA for status checks
            COMMIT_SHA=$(git rev-parse HEAD)

            # Create the PR
            echo "Creating Pull Request..."
            PR_URL=$(gh pr create \
              --title "Move plans to completed (from PR #${{ github.event.pull_request.number }})" \
              --body "Automated task: Moving plan files associated with branch $PR_BRANCH_NAME to the completed folder." \
              --base "$TARGET_BRANCH" \
              --head "$AUTO_PR_BRANCH")

            # Create status checks from repository variable (required because GitHub App
            # token cannot read branch protection rules via API in workflow context)
            # Set PLAN_AUTOMATION_STATUS_CHECKS as comma-separated list: "check1,check2"
            echo "Creating required status checks from repository variable..."
            STATUS_CHECKS="${{ vars.PLAN_AUTOMATION_STATUS_CHECKS }}"

            if [ -n "$STATUS_CHECKS" ]; then
              echo "Status checks to create: $STATUS_CHECKS"
              IFS=',' read -ra CHECKS <<< "$STATUS_CHECKS"
              for check in "${CHECKS[@]}"; do
                check=$(echo "$check" | xargs)  # trim whitespace
                if [ -n "$check" ]; then
                  echo "  Creating: '$check'"
                  gh api repos/:owner/:repo/statuses/$COMMIT_SHA \
                    -f state=success \
                    -f context="$check" \
                    -f description="Skipped for automation" && echo "    ✓ Created" || echo "    ⚠ Failed"
                fi
              done
            else
              echo "⚠ PLAN_AUTOMATION_STATUS_CHECKS variable not set - skipping status checks"
              echo "  If your branch requires status checks, the merge will fail"
              echo "  Set the variable via: gh variable set PLAN_AUTOMATION_STATUS_CHECKS --body 'check1,check2'"
            fi

            # Merge immediately using admin flag to bypass approval requirements
            # Note: Requires the GitHub App to have "administration: write" permission
            echo "Merging PR with admin privileges..."
            gh pr merge "$PR_URL" --squash --delete-branch --admin

            echo "Successfully initiated merge for $MOVED_FILES file(s)."
          else
            echo "No matching plan files found. Nothing to do."
          fi
